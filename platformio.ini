; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts =
    pre:tools/select_language.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    ; USB CDC (S3)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Audio task core
    -D ARDUINO_RUNNING_CORE=1
    ;Enable logging for SimpleRadioSerial library
    ;-D SIMPLE_RADIO_SERIAL_LOGS=1
    ; Hardware options and pins live in src/config/hardware_config.h.
    ; Temporary fixed WiFi test mode belongs in local secrets.ini.
    ; See secrets.example.ini.

    -Wall
    -Wextra
    -Wno-unused-function

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#6f44f0ab8d9a0889eaa4460b82d6b223b40dbddc
    lovyan03/LovyanGFX @ 1.2.25
	ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.11.2
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8.0
    crankyoldgit/IRremoteESP8266 @ 2.9.0
