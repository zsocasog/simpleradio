<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleRadio · WiFi</title>
  <link rel="icon" href="favicon.svg?v=1.3.14&amp;ui=900d1b5d10bd" type="image/svg+xml">
  <link rel="stylesheet" href="wifi.css?v=1.3.14&amp;ui=900d1b5d10bd">
</head>
<body>
  <main class="setup">
    <div class="instrument">
      <div class="wordmark"><img src="favicon.svg?v=1.3.14&amp;ui=900d1b5d10bd" alt="" width="38" height="38">SimpleRadio</div>
      <div class="spectrum" aria-hidden="true">
        <div class="spectrum-bars"><i style="--h:37%"></i><i style="--h:57%"></i><i style="--h:82%"></i><i style="--h:51%"></i><i style="--h:94%"></i><i style="--h:67%"></i><i style="--h:44%"></i><i style="--h:77%"></i><i style="--h:100%"></i><i style="--h:62%"></i><i style="--h:85%"></i><i style="--h:47%"></i><i style="--h:53%"></i><i style="--h:91%"></i><i style="--h:69%"></i><i style="--h:42%"></i><i style="--h:80%"></i><i style="--h:98%"></i><i style="--h:60%"></i><i style="--h:86%"></i><i style="--h:49%"></i><i style="--h:74%"></i><i style="--h:95%"></i><i style="--h:56%"></i></div>
      </div>
    </div>
    <section class="setup-panel" aria-labelledby="title">
      <h1 id="title" data-i18n="wifi.title">WiFi-beállítás</h1>
      <p class="intro" id="intro" data-i18n="wifi.setupIntro">Melyik hálózaton szeretnéd használni a rádiót?</p>
      <form id="setupForm">
        <div class="field-heading"><label id="networkLabel" for="networkPicker" data-i18n="wifi.network">Hálózat</label>
          <button type="button" id="rescan" class="text-button"><svg class="icon " aria-hidden="true" focusable="false"><use href="icons.svg#refresh"></use></svg><span data-i18n="wifi.rescan">Újrakeresés</span></button>
        </div>
        <div class="picker" id="picker">
          <button type="button" id="networkPicker" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="networks" aria-labelledby="networkLabel networkValue" disabled>
            <svg class="icon " aria-hidden="true" focusable="false"><use href="icons.svg#wifi"></use></svg><span id="networkValue" data-i18n="wifi.choose">Válassz hálózatot</span><svg class="icon chevron" aria-hidden="true" focusable="false"><use href="icons.svg#chevron-down"></use></svg>
          </button>
          <ul id="networks" role="listbox" aria-labelledby="networkLabel" hidden></ul>
        </div>
        <div id="passwordField" class="password-field">
          <label for="pass" data-i18n="wifi.password">Jelszó</label>
          <div class="password-input"><input id="pass" name="wifi-network-secret" type="password" maxlength="64" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore>
            <button id="showPassword" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false"><svg class="icon " aria-hidden="true" focusable="false"><use href="icons.svg#eye"></use></svg></button>
          </div>
        </div>
        <button type="submit" id="connect" class="primary" disabled><span data-i18n="wifi.connect">Csatlakozás</span><svg class="icon " aria-hidden="true" focusable="false"><use href="icons.svg#chevron-right"></use></svg></button>
      </form>
      <div id="handoff" hidden><a class="address" id="radioLink"><span data-i18n="wifi.openRadio">Rádió megnyitása</span><svg class="icon " aria-hidden="true" focusable="false"><use href="icons.svg#external-link"></use></svg><strong id="radioIp"></strong></a></div>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
  <script src="i18n-catalog.js?v=1.3.14&amp;ui=900d1b5d10bd"></script>
  <script src="i18n.js?v=1.3.14&amp;ui=900d1b5d10bd"></script>
  <script src="wifi.js?v=1.3.14&amp;ui=900d1b5d10bd"></script>
</body>
</html>
