<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleRadio WiFi</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=1.2.08&amp;ui=9fd22659759f">
  <link rel="stylesheet" href="wifi.css?v=1.2.08&amp;ui=9fd22659759f">
</head>
<body>
  <main class="wifi-shell">
    <section class="wifi-card">
      <div class="brand-mark">SR</div>
      <h1 data-i18n="wifi.title">WiFi beállítás</h1>
      <p data-i18n="wifi.help">Válaszd ki a hálózatot, add meg a jelszót, majd mentsd a rádióra.</p>

      <label>
        <span data-i18n="wifi.network">Hálózat</span>
        <select id="ssid"></select>
      </label>

      <label>
        <span data-i18n="wifi.password">Jelszó</span>
        <input id="pass" name="wifi-network-secret" type="password" placeholder="WiFi jelszó" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" data-form-type="other" data-1p-ignore data-lpignore="true" data-bwignore>
      </label>

      <button type="button" onclick="save()" data-i18n="save.idle">Mentés</button>
      <span id="status" data-i18n="wifi.scanning">Hálózatok keresése...</span>
    </section>
  </main>
  <script src="i18n-catalog.js?v=1.2.08&amp;ui=9fd22659759f"></script>
  <script src="i18n.js?v=1.2.08&amp;ui=9fd22659759f"></script>
  <script src="wifi.js?v=1.2.08&amp;ui=9fd22659759f"></script>
</body>
</html>
